name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则自动从 build.gradle.kts 读取，例如 1.0.2）"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Package APK
        id: pkg
        run: |
          DEFAULT_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$DEFAULT_VERSION"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PinLoc-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=dist/PinLoc-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "发布版本: PinLoc-${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: PinLoc-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.apk }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: PinLoc ${{ steps.pkg.outputs.version }}
          files: ${{ steps.pkg.outputs.apk }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
